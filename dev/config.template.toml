workspace_dir = "/zeroclaw-data/workspace"
config_path = "/zeroclaw-data/.zeroclaw/config.toml"
# This is the Ollama Base URL, not a secret key
api_key = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "llama3.2"
default_temperature = 0.7

[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false
web_dist_dir = "/zeroclaw-data/web/dist"

# Cost tracking and budget enforcement configuration
# Enable to track API usage costs and enforce spending limits
[cost]
enabled = false
daily_limit_usd = 10.0
monthly_limit_usd = 100.0
warn_at_percent = 80
allow_override = false

# Per-model pricing (USD per 1M tokens)
# Uncomment and customize to override default pricing
# [cost.prices."anthropic/claude-sonnet-4-20250514"]
# input = 3.0
# output = 15.0
#
# [cost.prices."openai/gpt-4o"]
# input = 5.0
# output = 15.0

# WhatsApp Web channel (pair-code linking, no Meta Business token needed).
# Uncomment and fill in to enable brai on a dedicated second WhatsApp number.
# [channels_config.whatsapp]
# enabled = true
# session_path = "~/.brai/whatsapp-session.db"
# pair_phone = "15551234567"          # brai's dedicated second number
# mode = "personal"
# self_chat_mode = true
# master_identity = "15550001111"     # YOUR own WhatsApp number
# contact_gate_enabled = true          # default; set false to disable the approval gate
